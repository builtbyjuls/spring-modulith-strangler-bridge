name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven build and verify
        run: ./mvnw -B clean verify

      - name: Publish Strangler Parity Report to GitHub Step Summary
        if: always()
        run: |
          find . -type f -path "*/target/strangler-reports/summary.md" -exec cat {} + >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Strangler Parity and Manifest Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strangler-reports
          path: "**/target/strangler-reports/*"
          if-no-files-found: ignore
