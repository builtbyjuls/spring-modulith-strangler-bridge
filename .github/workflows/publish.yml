name: Publish to Maven Central

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify packaging without deploying to Central)'
        required: true
        type: boolean
        default: false

jobs:
  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify test suite
        run: ./mvnw -B clean verify

      - name: Import GPG key
        if: ${{ !inputs.dry_run }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Dry run packaging
        if: ${{ inputs.dry_run }}
        run: ./mvnw -B clean package -P release -Dgpg.skip=true -DskipTests

      - name: Deploy to Maven Central
        if: ${{ !inputs.dry_run }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B clean deploy -P release -DskipTests -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
