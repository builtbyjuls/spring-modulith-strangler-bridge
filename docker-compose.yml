services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: grid_settlement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  metering-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metering-worker
    command: ["--modulith.bridge.host-only=metering"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grid_settlement
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  modulith-main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modulith-main
    command:
      - "--modulith.bridge.modules.metering.mode=REMOTE"
      - "--modulith.bridge.modules.metering.url=http://metering-worker:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grid_settlement
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      metering-worker:
        condition: service_started
