apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering-worker
  labels:
    app: metering-worker
    tier: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: metering-worker
  template:
    metadata:
      labels:
        app: metering-worker
        tier: worker
    spec:
      containers:
        - name: metering-worker
          image: grid-settlement-modulith:latest
          args: ["--modulith.bridge.host-only=metering"]
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/grid_settlement
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: metering-worker
  labels:
    app: metering-worker
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: metering-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modulith-main
  labels:
    app: modulith-main
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modulith-main
  template:
    metadata:
      labels:
        app: modulith-main
        tier: api
    spec:
      containers:
        - name: modulith-main
          image: grid-settlement-modulith:latest
          args:
            - "--modulith.bridge.modules.metering.mode=REMOTE"
            - "--modulith.bridge.modules.metering.url=http://metering-worker:8080"
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/grid_settlement
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: modulith-main
  labels:
    app: modulith-main
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: modulith-main
